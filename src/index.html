<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeRun Agent</title>
  <style>
    html, body, #app {
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      box-sizing: border-box !important;
    }
  </style>
  <link rel="stylesheet" href="Dashboard.css">
  <link rel="stylesheet" href="ChatSpace.css">
  <link rel="stylesheet" href="SubagentPanel.css">
  <base target="_blank">
</head>
<body>
  <div id="app"></div>

  <script src="MarkdownRenderer.js"></script>
  <script src="Dashboard.js"></script>
  <script src="ChatSpace.js"></script>
  <script>
    window.CODERUN_CONFIG = { provider: 'ollama', baseUrl: 'http://localhost:11434', model: '' };
    window.WORKSPACE_FOLDER = '';
    window.VSCODE = false;
    window.onload = function() {
      if (typeof renderDashboard === 'function') {
        renderDashboard(document.getElementById('app'));
      } else {
        document.getElementById('app').innerHTML = '<div style="color:red;padding:20px;">Error: Dashboard not loaded</div>';
      }
    };
  </script>
</body>
</html>
